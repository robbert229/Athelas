# Builds Athelas & ROTK Fix on every push. Pushing a tag like v1.0 also publishes a
# release with the .7z, so every download is built from the code shown here.
name: build
on:
  push:
    branches: [main, 'integration/**']
    tags: ['v*']
  pull_request:
# read-only by default; only the tag-only publish job below may write (review, 5 Nov)
permissions:
  contents: read
env:
  SDL_VERSION: 3.4.20
  DXVK_VERSION: "3.1.1"
  # the downloads' checksums: a changed or swapped file stops the build (update them with the versions)
  SDL_SHA256: d2d3bf3fb97a90b22e908a306d7362631ef1bab229d988fe6669595dc29cd9ed
  DXVK_SHA256: 40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 zip p7zip-full
      - name: Download SDL3 and DXVK
        run: |
          mkdir -p deps
          curl -sSfL -o deps/sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-devel-$SDL_VERSION-mingw.tar.gz"
          curl -sSfL -o deps/dxvk.tgz "https://github.com/doitsujin/dxvk/releases/download/v$DXVK_VERSION/dxvk-$DXVK_VERSION.tar.gz"
          printf '%s  deps/sdl.tgz\n%s  deps/dxvk.tgz\n' "$SDL_SHA256" "$DXVK_SHA256" | sha256sum -c -
          tar -xzf deps/sdl.tgz -C deps
          tar -xzf deps/dxvk.tgz -C deps
      # 3D sound (DSOAL + OpenAL Soft) comes from third_party/dsoal: the
      # upstream download link always points at the newest build.
      - name: Build and package
        run: |
          VER=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || VER=dev-${GITHUB_SHA::7}
          (cd third_party/dsoal && sha256sum -c SHA256SUMS)
          SDL_DIR=$PWD/deps/SDL3-$SDL_VERSION DXVK_DIR=$PWD/deps/dxvk-$DXVK_VERSION DSOAL_DIR=$PWD/third_party/dsoal sh scripts/package.sh "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Athelas-${{ env.VER }}
          path: dist/Athelas-${{ env.VER }}.7z*
          if-no-files-found: error
  # the launcher's own tests (launcher/tests): versions, settings-file edits, unpacking a .7z.
  # A job of its own, so a problem setting up Wine never stops the build above.
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 p7zip-full wine wine32:i386
      - name: Download SDL3
        run: |
          mkdir -p deps
          curl -sSfL -o deps/sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-devel-$SDL_VERSION-mingw.tar.gz"
          printf '%s  deps/sdl.tgz\n' "$SDL_SHA256" | sha256sum -c -
          tar -xzf deps/sdl.tgz -C deps
      - name: Build the launcher and run its tests
        run: |
          export SDL_DIR=$PWD/deps/SDL3-$SDL_VERSION
          bash launcher/build.sh
          sh launcher/test.sh
  # the Linux side of the SDK, without a game (it can't be built here: that needs the player's default.xbe):
  # xbe_smoke, the runtime around a stand in, started alone and drawing through Vulkan on llvmpipe under Xvfb;
  # xbe_port_check, ROTK Xbox's own sources against a stand in of its image; then wincheck.sh, the runtime and
  # ROTK's sources compiled for Windows (the Linux work must not break them). Clang 22 from apt.llvm.org, as
  # the release's container (ports/rotk-xbox/rotkxbox/linux/Containerfile).
  linux:
    runs-on: ubuntu-24.04
    env:
      LLVM: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # SDL 3's -dev packages (it opens the libraries at run time), Xvfb and Mesa's Vulkan (llvmpipe)
          sudo apt-get install -y --no-install-recommends clang-$LLVM lld-$LLVM ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            xvfb xauth mesa-vulkan-drivers libvulkan1
          for t in clang clang++ ld.lld; do sudo ln -sf /usr/bin/$t-$LLVM /usr/local/bin/$t; done
          clang++ --version | head -1
      - name: Build xbe_smoke and xbe_port_check
        run: |
          cmake -S sdk/smoke -B sdk/smoke/build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DXBE_PORT=$PWD/ports/rotk-xbox/rotkxbox
          ninja -C sdk/smoke/build xbe_smoke xbe_port_check
      - name: Run them
        working-directory: sdk/smoke/build
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          # llvmpipe (Ubuntu names it lvp_icd.json, Fedora lvp_icd.x86_64.json)
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          ./xbe_smoke
          xvfb-run -a -s '-screen 0 1280x800x24' ./xbe_smoke --window --frames 60
          xvfb-run -a -s '-screen 0 1280x800x24' ./xbe_smoke --vulkan --audio --frames 120
          # the port's real start, as far as finding the game: 2 is "no game files"
          code=0; ./xbe_port_check --no-dialogs || code=$?
          [ "$code" = 2 ] || { echo "xbe_port_check exited $code, not 2"; exit 1; }
      - name: Logs
        if: always()
        run: tail -n 40 sdk/smoke/build/logs/*.log || true
      - name: Windows syntax check
        run: |
          # in Fedora, whose mingw64 headers wincheck.sh is written for (Ubuntu's are older: no DRED, and a
          # __cpuidex clash with clang 22); the dependencies' headers from the configure above
          docker run --rm -v "$PWD:/w" -w /w registry.fedoraproject.org/fedora:44 bash -c '
            dnf install -y -q clang mingw64-gcc-c++ mingw64-headers git >/dev/null &&
            git config --global --add safe.directory /w &&
            sdk/smoke/wincheck.sh $(git ls-files "sdk/runtime/*.cpp" "ports/rotk-xbox/rotkxbox/src/*.cpp")'
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Athelas-*        # the build job's .7z (named without the tag's "v")
          merge-multiple: true
          path: dist
      - name: Publish release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" dist/Athelas-$VER.7z dist/Athelas-$VER.7z.sha256 --draft --title "Athelas $VER" --notes-file "$(test -f docs/release-notes-$VER.md && echo docs/release-notes-$VER.md || echo dist-files/README.txt)"
